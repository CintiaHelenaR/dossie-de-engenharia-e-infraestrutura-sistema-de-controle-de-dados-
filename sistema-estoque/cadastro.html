<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
         
        <title>Cadastrar Produto</title>
<link rel="stylesheet" href="estilo.css">
    </head>
<body>
        <header>
            <h1>Controle de Estoque</h1>
            <p>Cadastro dos Produtos</p>
        </header>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="cadastro.html">Cadastrar Produtos</a>
        </nav>
        <main>
            <section>
                <h2>Cadastrar novos produtos</h2>
                <p>Preencha os campos abaixo para adicionar um produto ao estoque.</p>
                <form id="formCadastro">
                    <label for="nome">Nome do produto:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite o nome do produto" required>
                    <label for="categoria">Categoria:</label>
                    <input type="text" id="categoria" name="categoria" placeholder="Digite a categoria" required>
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" name="quantidade" min="0" placeholder="Digite a quantidade"required>
                    <label for="preco">Preço (R$):</label>
<input type="number" id="preco" name="preco" min="0" step="0.01" placeholder="Digite o preço" required>
                    <button type="submit" class="botao">
                        Cadastrar Produto
                    </button> 
                </form>
                <br>
                <a href="index.html" class="botao">Voltar ao inicio</a>
                </section>
        </main>
        <footer>
            <p>Projeto desenvolvido por Cintia,Iago,Maria Eduarda Cruz,Sara</p>
        </footer>
        <script src="cadastro.js"></script>
    </body>
</html>
